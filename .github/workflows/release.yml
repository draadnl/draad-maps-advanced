name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PHP_VERSION=$(grep -m1 '^\s*\*\s*Version:' draad-maps-plugin.php | sed 's/.*Version:\s*//' | tr -d '[:space:]')
          PKG_VERSION=$(grep '"version"' package.json | sed 's/.*"version": *"\(.*\)".*/\1/')

          echo "Tag:          $TAG"
          echo "PHP header:   $PHP_VERSION"
          echo "package.json: $PKG_VERSION"

          if [ "$TAG" != "$PHP_VERSION" ] || [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch — tag ($TAG), PHP header ($PHP_VERSION), package.json ($PKG_VERSION) must all match."
            exit 1
          fi

      - name: Extract changelog section
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \[$TAG\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No changelog section found for [$TAG] in CHANGELOG.md. Add an entry before tagging."
            exit 1
          fi

      - name: Stage plugin directory
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/draad-maps-plugin
          cp draad-maps-plugin.php README.md composer.json /tmp/draad-maps-plugin/
          cp -r includes build assets /tmp/draad-maps-plugin/
          cd /tmp && zip -r "draad-maps-plugin-${TAG}.zip" draad-maps-plugin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: /tmp/draad-maps-plugin-*.zip
          fail_on_unmatched_files: true
